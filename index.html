
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epicondilitis</title>
<meta name="theme-color" content="#14211d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Epicondilitis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#14211d; --panel:#1d2f29; --ink:#eef3ef; --muted:#8fa79d;
    --up:#f2b84b; --down:#6cc4a1; --rest:#7aa7d9; --line:#3a5248;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);
    display:flex;flex-direction:column;align-items:center;gap:12px;
    max-width:520px;margin:0 auto;
  }
  .top{display:flex;width:100%;align-items:center;gap:10px;margin-top:14px}
  h1{font-size:22px;font-weight:700;text-align:center;flex:1}
  #mute{flex:0 0 auto;width:44px;height:44px;padding:0;font-size:20px;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .sub{color:var(--muted);font-size:15px;text-align:center;margin-top:-6px}
  .tabs{display:flex;gap:6px;width:100%;align-items:center}
  .arrow{color:var(--muted);font-size:20px;flex:0 0 auto}
  .tab{flex:1;padding:12px 4px;font-size:15px;background:var(--panel);color:var(--muted);border:2px solid var(--line)}
  .tab small{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
  .tab.on{color:var(--ink);border-color:var(--down)}
  .panel{background:var(--panel);border-radius:18px;width:100%;padding:12px}
  .panel svg{width:100%;height:auto;max-height:24vh;display:block}
  .phase{font-size:34px;font-weight:800;text-align:center;letter-spacing:.5px}
  .count{font-size:64px;font-weight:800;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
  .info{display:flex;gap:10px;width:100%}
  .box{flex:1;background:var(--panel);border-radius:14px;padding:10px;text-align:center}
  .box b{display:block;font-size:26px}
  .box span{color:var(--muted);font-size:13px}
  .btns{display:flex;gap:10px;width:100%}
  button{
    flex:1;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;
    background:var(--down);color:#0d1a15;
  }
  button.sec{flex:0 0 36%;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  #hint{flex:0 0 auto;background:none;color:var(--muted);border:0;padding:2px 14px 6px;font-size:13px;font-weight:600}

  /* ---------- Pantalla de ajustes (blanca) ---------- */
  .sheet{
    position:fixed;inset:0;z-index:10;background:#fff;color:#111;
    display:flex;flex-direction:column;
    transform:translateY(100%);visibility:hidden;
    transition:transform .3s ease,visibility 0s linear .3s;
  }
  .sheet.open{transform:none;visibility:visible;transition:transform .3s ease}
  @media (prefers-reduced-motion:reduce){.sheet,.sheet.open{transition:none}}
  .sheet-head{
    padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 10px;
    border-bottom:1px solid #e3e6e5;touch-action:none;
  }
  .grab{width:44px;height:5px;border-radius:3px;background:#c9cfcd;margin:0 auto 10px}
  .head-row{display:flex;align-items:center;gap:10px}
  .head-row h2{flex:1;font-size:22px;font-weight:700}
  .sheet button.done{flex:0 0 auto;padding:10px 20px;font-size:17px;background:#14211d;color:#fff;border-radius:12px}
  .sheet-body{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 24px);
    max-width:520px;width:100%;margin:0 auto;
  }
  .grp{background:#f3f5f4;border-radius:16px;padding:14px;margin-bottom:14px}
  .grp h3{font-size:18px;font-weight:700}
  .grp .gs{font-size:14px;color:#5b6d66;margin:2px 0 6px}
  .fld{padding-top:12px}
  .fld label{display:block;font-size:15px;color:#2b3a35;margin-bottom:6px}
  .stepper{display:flex;gap:8px;align-items:center}
  .stepper input{
    flex:1;min-width:0;height:48px;text-align:center;font-size:20px;font-weight:600;
    border:1px solid #c5cdca;border-radius:12px;background:#fff;color:#111;
    font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;
  }
  .stepper input:focus{outline:2px solid #14211d;outline-offset:1px}
  .sheet .stp{
    flex:0 0 auto;width:52px;height:48px;padding:0;font-size:28px;font-weight:600;line-height:1;
    background:#e3e8e6;color:#111;border-radius:12px;
  }
  .stepper .unit{flex:0 0 auto;width:22px;color:#5b6d66;font-size:15px}
  .sheet button.defaults{flex:none;width:100%;margin-top:4px;background:#fff;color:#111;border:1px solid #c5cdca;font-size:16px;padding:14px}
</style>
</head>
<body>
  <div class="top">
    <h1 id="ex">Codo de golfista</h1>
    <button id="mute" aria-label="Silenciar sonido">🔊</button>
  </div>
  <p class="sub" id="exsub">3 kg</p>

  <div class="tabs">
    <button class="tab" id="tab0">Golfista<small>3 kg</small></button>
    <span class="arrow">→</span>
    <button class="tab" id="tab2">Descanso</button>
    <span class="arrow">→</span>
    <button class="tab" id="tab1">Tenista<small>2 kg</small></button>
  </div>

  <div class="panel">
    <svg viewBox="0 0 320 230" aria-hidden="true">
      <rect x="10" y="156" width="190" height="8" rx="4" fill="#3a5248"/>
      <rect x="20" y="109" width="190" height="44" rx="10" fill="#e0a784"/>
      <g transform="rotate(-45 190 131)" opacity=".35">
        <rect x="190" y="109" width="84" height="44" rx="16" fill="none" stroke="#eef3ef" stroke-width="2" stroke-dasharray="6 5"/>
      </g>
      <g transform="rotate(45 190 131)" opacity=".35">
        <rect x="190" y="109" width="84" height="44" rx="16" fill="none" stroke="#eef3ef" stroke-width="2" stroke-dasharray="6 5"/>
      </g>
      <g id="hand" transform="rotate(45 190 131)">
        <rect x="190" y="109" width="84" height="44" rx="16" fill="#e0a784"/>
      </g>
    </svg>
  </div>

  <div class="phase" id="phase">Listo</div>
  <div class="count" id="count">3</div>

  <div class="info">
    <div class="box"><b id="set">1/3</b><span>Serie</span></div>
    <div class="box"><b id="rep">1/10</b><span>Repetición</span></div>
    <div class="box"><b id="exn">1/2</b><span>Ejercicio</span></div>
  </div>

  <div class="btns">
    <button id="go">Iniciar</button>
    <button class="sec" id="reset">Reiniciar</button>
  </div>
  <button id="hint" aria-label="Abrir ajustes">⌃ Desliza hacia arriba para los ajustes</button>

  <!-- Pantalla blanca de ajustes -->
  <div class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-label="Ajustes">
    <div class="sheet-head" id="sheetHead">
      <div class="grab"></div>
      <div class="head-row">
        <h2>Ajustes</h2>
        <button class="done" id="closeSheet">Listo</button>
      </div>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

<script>
(function(){
  var EX=[
    {n:"Codo de golfista",s:"3 kg",k:"golfista"},
    {n:"Codo de tenista",s:"2 kg",k:"tenista"}
  ];
  var SETS=3, MAXANG=45;
  var KEY="epicondilitis_cfg_v1";
  var st, last=0, lastRest=0, muted=false, ac=null, dirty=false;
  var $=function(i){return document.getElementById(i)};

  /* ---------- Configuración ---------- */
  function defaults(){
    return {
      ex:[{reps:10,sec:2,rest:60,warn:10},{reps:10,sec:2,rest:60,warn:10}],
      c:{rest:60,warn:10}
    };
  }
  var LIM={reps:[1,99,1],sec:[1,60,1],rest:[0,600,5],warn:[0,60,1]};
  function clamp(k,v){ return Math.min(LIM[k][1],Math.max(LIM[k][0],v)); }
  function load(){
    var c=defaults();
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){
        var o=JSON.parse(raw);
        [0,1].forEach(function(i){
          ["reps","sec","rest","warn"].forEach(function(k){
            var v=o&&o.ex&&o.ex[i]&&parseInt(o.ex[i][k],10);
            if(!isNaN(v)&&v!==undefined) c.ex[i][k]=clamp(k,v);
          });
        });
        ["rest","warn"].forEach(function(k){
          var v=o&&o.c&&parseInt(o.c[k],10);
          if(!isNaN(v)&&v!==undefined) c.c[k]=clamp(k,v);
        });
      }
    }catch(e){}
    return c;
  }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(cfg)); }catch(e){} }
  var cfg=load();

  /* ---------- Sonido ---------- */
  function audio(){
    if(!ac){
      var C=window.AudioContext||window.webkitAudioContext;
      if(C) ac=new C();
    }
    if(ac && ac.state==="suspended") ac.resume();
  }
  function beep(freq,secs,delay){
    if(muted||!ac) return;
    var t0=ac.currentTime+(delay||0);
    var o=ac.createOscillator(), g=ac.createGain();
    o.type="sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(0.4,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+secs);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+secs+0.05);
  }
  var S={
    up:function(){beep(880,0.18)},
    down:function(){beep(440,0.18)},
    tick:function(){beep(660,0.1)},
    go:function(){beep(1040,0.6)},
    done:function(){beep(660,0.2,0);beep(880,0.2,0.25);beep(1320,0.5,0.5)}
  };

  /* ---------- Lógica ---------- */
  function cx(){ return cfg.ex[st.ex]||cfg.ex[0]; }
  /* Descanso entre series del mismo ejercicio = el del ejercicio;
     descanso entre ejercicios y pestaña "Descanso" = el central. */
  function restCfg(){
    if(st.phase==="solo") return cfg.c;
    return st.set<SETS ? cx() : cfg.c;
  }
  function init(){ st={ex:0,set:1,rep:1,phase:"ready",t:0,running:false}; lastRest=0; render(); }
  function dur(){
    if(st.phase==="up"||st.phase==="down") return cx().sec;
    if(st.phase==="rest"||st.phase==="solo") return restCfg().rest;
    return cx().sec;
  }
  function ease(p){ return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; }

  function advance(){
    st.t=0; lastRest=0;
    if(st.phase==="up"){ st.phase="down"; S.down(); }
    else if(st.phase==="down"){
      if(st.rep<cx().reps){ st.rep++; st.phase="up"; S.up(); }
      else if(st.set<SETS || st.ex<EX.length-1){ st.phase="rest"; }
      else { st.phase="done"; st.running=false; S.done(); }
    } else if(st.phase==="solo"){
      st={ex:0,set:1,rep:1,phase:"ready",t:0,running:false}; S.go();
    } else if(st.phase==="rest"){
      if(st.set<SETS){ st.set++; }
      else { st.ex++; st.set=1; }
      st.rep=1; st.phase="up"; S.go();
    }
  }

  function startEx(i){
    audio();
    st={ex:i,set:1,rep:1,phase:"up",t:0,running:true}; lastRest=0;
    S.go();
  }

  function startSolo(){
    audio();
    st={ex:0,set:1,rep:1,phase:"solo",t:0,running:true}; lastRest=0;
    S.down();
  }

  function angle(){
    var p=Math.min(st.t/dur(),1);
    if(st.phase==="up") return MAXANG-2*MAXANG*ease(p);
    if(st.phase==="down") return -MAXANG+2*MAXANG*ease(p);
    return MAXANG;
  }

  function render(){
    var e=EX[st.ex];
    var solo=st.phase==="solo", act=st.phase!=="ready"&&!solo;
    $("ex").textContent=solo?"Descanso":e.n;
    $("exsub").textContent=solo?"Cuenta atrás de "+fmt(cfg.c.rest):e.s;
    $("tab0").className="tab"+(act&&st.ex===0?" on":"");
    $("tab1").className="tab"+(act&&st.ex===1?" on":"");
    $("tab2").className="tab"+(solo?" on":"");
    $("hand").setAttribute("transform","rotate("+angle().toFixed(2)+" 190 131)");
    $("set").textContent=solo?"–":st.set+"/"+SETS;
    $("rep").textContent=solo?"–":st.rep+"/"+cx().reps;
    $("exn").textContent=solo?"–":(st.ex+1)+"/"+EX.length;
    var ph=$("phase"), c=$("count"), remain=Math.ceil(dur()-st.t-0.0001);
    if(remain<0) remain=0;
    if(st.phase==="ready"){ ph.textContent="Listo"; ph.style.color="var(--ink)"; c.textContent=cx().sec; }
    else if(st.phase==="up"){ ph.textContent="SUBE"; ph.style.color="var(--up)"; c.textContent=remain; }
    else if(st.phase==="down"){ ph.textContent="BAJA"; ph.style.color="var(--down)"; c.textContent=remain; }
    else if(solo){ ph.textContent="DESCANSO"; ph.style.color="var(--rest)"; c.textContent=remain; }
    else if(st.phase==="rest"){
      var nextEx=(st.set>=SETS)?EX[st.ex+1].k:null;
      ph.textContent=nextEx?"DESCANSO · luego "+nextEx:"DESCANSO";
      ph.style.color="var(--rest)"; c.textContent=remain;
    }
    else { ph.textContent="¡Terminado!"; ph.style.color="var(--down)"; c.textContent="✓"; }
    $("go").textContent=st.running?"Pausar":(st.phase==="done"?"Hecho":(st.phase==="ready"?"Iniciar":"Seguir"));
  }
  function fmt(s){
    if(s>=60){ var m=Math.floor(s/60), r=s%60; return m+" min"+(r?" "+r+" s":""); }
    return s+" s";
  }

  function tick(now){
    if(st.running){
      st.t+=(now-last)/1000;
      while(st.running && st.t>=dur()){ var over=st.t-dur(); advance(); st.t=over; }
      if(st.running && (st.phase==="rest"||st.phase==="solo")){
        var rc=restCfg();
        var r=Math.ceil(rc.rest-st.t-0.0001);
        if(rc.warn>0 && r<=rc.warn && r>0 && r!==lastRest){ lastRest=r; S.tick(); }
      }
    }
    last=now; render(); requestAnimationFrame(tick);
  }

  $("go").addEventListener("click",function(){
    if(st.phase==="done") return;
    audio();
    if(st.phase==="ready"){ st.phase="up"; st.t=0; S.go(); }
    st.running=!st.running;
  });
  $("reset").addEventListener("click",init);
  $("tab0").addEventListener("click",function(){startEx(0)});
  $("tab1").addEventListener("click",function(){startEx(1)});
  $("tab2").addEventListener("click",startSolo);
  $("mute").addEventListener("click",function(){
    muted=!muted; $("mute").textContent=muted?"🔇":"🔊";
    $("mute").setAttribute("aria-label",muted?"Activar sonido":"Silenciar sonido");
    if(!muted) audio();
  });

  /* ---------- Pantalla de ajustes ---------- */
  var sheet=$("sheet"), body=$("sheetBody");
  var FIELDS=[
    {k:"reps",l:"Repeticiones",u:""},
    {k:"sec",l:"Tiempo por repetición (subida y bajada)",u:"s"},
    {k:"rest",l:"Descanso entre series",u:"s"},
    {k:"warn",l:"Aviso sonoro antes de acabar el descanso",u:"s"}
  ];
  var CFIELDS=[
    {k:"rest",l:"Descanso central (entre ejercicios y pestaña Descanso)",u:"s"},
    {k:"warn",l:"Aviso sonoro antes de acabar el descanso",u:"s"}
  ];
  var uid=0;

  function field(group,f){
    var id="f"+(uid++);
    var wrap=document.createElement("div"); wrap.className="fld";
    var lab=document.createElement("label"); lab.htmlFor=id; lab.textContent=f.l;
    var row=document.createElement("div"); row.className="stepper";
    var minus=document.createElement("button"); minus.type="button"; minus.className="stp"; minus.textContent="−"; minus.setAttribute("aria-label","Menos: "+f.l);
    var inp=document.createElement("input"); inp.id=id; inp.type="text"; inp.inputMode="numeric"; inp.pattern="[0-9]*"; inp.autocomplete="off"; inp.value=group[f.k];
    var plus=document.createElement("button"); plus.type="button"; plus.className="stp"; plus.textContent="+"; plus.setAttribute("aria-label","Más: "+f.l);
    var unit=document.createElement("span"); unit.className="unit"; unit.textContent=f.u;
    function cur(){ var n=parseInt(inp.value,10); return isNaN(n)?group[f.k]:n; }
    function set(v){
      v=clamp(f.k,v);
      if(v!==group[f.k]) dirty=true;
      group[f.k]=v; inp.value=v; save();
    }
    minus.addEventListener("click",function(){ set(cur()-LIM[f.k][2]); });
    plus.addEventListener("click",function(){ set(cur()+LIM[f.k][2]); });
    inp.addEventListener("change",function(){ set(cur()); });
    inp.addEventListener("focus",function(){ inp.select(); });
    row.appendChild(minus); row.appendChild(inp); row.appendChild(plus); row.appendChild(unit);
    wrap.appendChild(lab); wrap.appendChild(row);
    return wrap;
  }
  function group(title,sub,grp,fields){
    var g=document.createElement("div"); g.className="grp";
    var h=document.createElement("h3"); h.textContent=title; g.appendChild(h);
    if(sub){ var p=document.createElement("div"); p.className="gs"; p.textContent=sub; g.appendChild(p); }
    fields.forEach(function(f){ g.appendChild(field(grp,f)); });
    return g;
  }
  function buildSheet(){
    body.innerHTML=""; uid=0;
    body.appendChild(group(EX[0].n,EX[0].s,cfg.ex[0],FIELDS));
    body.appendChild(group(EX[1].n,EX[1].s,cfg.ex[1],FIELDS));
    body.appendChild(group("Descanso central","Entre los dos ejercicios",cfg.c,CFIELDS));
    var d=document.createElement("button"); d.type="button"; d.className="defaults"; d.textContent="Restablecer valores iniciales";
    d.addEventListener("click",function(){ cfg=defaults(); save(); dirty=true; buildSheet(); });
    body.appendChild(d);
  }
  function isOpen(){ return sheet.classList.contains("open"); }
  function openSheet(){
    if(isOpen()) return;
    st.running=false;
    buildSheet();
    body.scrollTop=0;
    sheet.classList.add("open"); sheet.setAttribute("aria-hidden","false");
  }
  function closeSheet(){
    if(!isOpen()) return;
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    sheet.classList.remove("open"); sheet.setAttribute("aria-hidden","true");
    if(dirty){ dirty=false; init(); }
  }
  $("closeSheet").addEventListener("click",closeSheet);
  $("hint").addEventListener("click",openSheet);

  /* Deslizar hacia arriba abre; deslizar hacia abajo sobre la cabecera cierra */
  var tx=0,ty=0,tTarget=null,multi=false;
  document.addEventListener("touchstart",function(e){
    multi=e.touches.length>1;
    var t=e.touches[0]; tx=t.clientX; ty=t.clientY; tTarget=e.target;
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(multi) return;
    var t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
    if(Math.abs(dy)<60 || Math.abs(dy)<Math.abs(dx)*1.5) return;
    if(!isOpen()){ if(dy<0) openSheet(); }
    else if(dy>0 && tTarget && tTarget.closest && tTarget.closest("#sheetHead")) closeSheet();
  },{passive:true});

  init(); requestAnimationFrame(function(n){ last=n; tick(n); });
})();
</script>
</body>
</html>
